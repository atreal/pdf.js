name: Release pdfjs-openads

# Build the generic viewer and publish a GitHub Release with the
# downloadable bundle when a release tag is pushed. The current scheme is
# `<version pdf.js officielle>-arNN` (ex. `v6.0.227-ar01`) ; l'ancien schéma
# `pdfjs-openads-*` reste accepté pour reconstruire les anciennes releases.
# Aussi déclenchable manuellement depuis l'onglet Actions.
on:
  push:
    tags:
      - 'v*-ar*'
      - 'pdfjs-openads-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à (re)builder (ex. v6.0.227-ar01)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build generic viewers
        run: npx gulp generic generic-legacy

      - name: Packages
        id: pkg
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          OUT="${TAG}.zip"
          (cd build/generic && zip -r "../../$OUT" .)
          echo "filename_modern=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

          OUT="${TAG}-legacy.zip"
          (cd build/generic-legacy && zip -r "../../$OUT" .)
          echo "filename_legacy=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Generate release notes body
        id: notes
        run: |
          cat <<EOF > release_notes.md
          ## Available versions

          Two builds are available: the default "modern" build for _latest_ browsers, and a legacy supporting older browers,
          [based on upstream pdf.js](https://github.com/mozilla/pdf.js/wiki/Frequently-Asked-Questions#which-browsersenvironments-are-supported)

          ## Quick install

          \`\`\`bash
          curl -L https://github.com/atreal/pdf.js/releases/download/${{ steps.ref.outputs.tag }}/${{ steps.pkg.outputs.filename_modern }} -o pdfjs.zip
          # or for the legacy build
          # curl -L https://github.com/atreal/pdf.js/releases/download/${{ steps.ref.outputs.tag }}/${{ steps.pkg.outputs.filename_legacy }} -o pdfjs.zip
          unzip pdfjs.zip -d /var/www/pdfjs/
          # Open : http://SERVER/pdfjs/web/viewer.html?file=...
          \`\`\`
          EOF

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          name: ${{ steps.ref.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.filename_modern }}
            ${{ steps.pkg.outputs.filename_legacy }}
